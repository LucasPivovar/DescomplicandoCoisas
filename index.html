<head>
<meta charset="utf-8">

<meta name="description" content="Links do Descomplicando Coisas.">
<title>Descomplicando Coisas</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  background:
    radial-gradient(ellipse at 50% 15%, #203c49 0%, transparent 54%),
    #101827;
  color: #f6f5f2;
  font: 1rem/1.5 system-ui, sans-serif;
}
.orbit {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
}
main {
  position: relative;
  width: min(calc(100% - 40px), 420px);
  margin: auto;
  padding: clamp(56px, 14vh, 112px) 0 40px;
  text-align: center;
}
.avatar {
  display: block;
  width: 88px;
  height: 88px;
  margin: 0 auto 15px;
  border-radius: 50%;
  border: 2px solid #86cbb7;
  object-fit: cover;
}
h1 {
  margin: 0;
  font-size: 1.45rem;
  letter-spacing: -.035em;
}
header { margin-bottom: 28px; }
.books { text-align: left; }
.books h2 { margin: 0 0 12px; font-size: 1rem; }
.book {
  display: grid;
  grid-template-columns: minmax(0, 1fr) clamp(68px, 23vw, 96px);
  align-items: center;
  gap: 16px;
  padding: 16px;
  border: 1px solid #374458;
  border-radius: 14px;
  background: #192334;
}
.book h3 { margin: 0; font-size: 1.12rem; }
.book p { margin: 3px 0 12px; color: #b5c0d0; font-size: .85rem; }
.cover { display: block; width: 100%; height: auto; border-radius: 5px; }
.book-link { color: #a3ead1; font-size: .88rem; text-underline-offset: 3px; }
.book-link:focus-visible { outline: 2px solid #86cbb7; outline-offset: 4px; }
.book small { display: block; margin-top: 3px; color: #b5c0d0; font-size: .74rem; }
</style>
</head>
