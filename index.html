<title>Descomplicando Coisas</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  background:
    radial-gradient(ellipse at 50% 15%, #203c49 0%, transparent 54%),
    #101827;
  color: #f6f5f2;
  font: 1rem/1.5 system-ui, sans-serif;
}
.orbit {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
}
main {
  position: relative;
  width: min(calc(100% - 40px), 420px);
  margin: auto;
  padding: clamp(56px, 14vh, 112px) 0 40px;
  text-align: center;
}
.avatar {
  display: block;
  width: 88px;
  height: 88px;
  margin: 0 auto 15px;
  border-radius: 50%;
  border: 2px solid #86cbb7;
  object-fit: cover;
}
h1 {
  margin: 0;
  font-size: 1.45rem;
  letter-spacing: -.035em;
}
header { margin-bottom: 28px; }
ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 10px; }
li {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 68px;
  padding: 10px 16px;
  border: 1px solid #374458;
  border-radius: 14px;
  background: #192334;
  font-weight: 600;
}
li small { color: #b5c0d0; font-size: .78rem; font-weight: 400; }
</style>
